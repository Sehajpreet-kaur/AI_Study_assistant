services:
  web:
    build: 
      context: .
      dockerfile: src/client/Dockerfile
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data
    depends_on: [server]
    restart: unless-stopped
      
  server:
    build: 
      context: .
      dockerfile: src/server/Dockerfile
    env_file: ./src/server/.env
    environment:
      RAG_URL: http://rag:8000
      PORT: 5000
    depends_on: [rag]
    restart: unless-stopped

  rag:
    build: ./src/rag-backend
    env_file: ./src/rag-backend/.env
    restart: unless-stopped

volumes:
  caddy_data: